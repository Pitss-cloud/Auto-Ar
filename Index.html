<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoScope AR Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #d32f2f;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .task-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .task button {
      background: #d32f2f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .task button:hover {
      background: #b71c1c;
    }

    #continueBtn {
      display: none;
      margin-top: 20px;
      background: #388e3c;
    }

    footer {
      text-align: center;
      padding: 10px;
      margin-top: 40px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>AutoScope AR Dashboard</h1>
  </header>

  <div class="container">
    <h2>Maintenance Tasks</h2>
    <div class="task-list">
      <div class="task">
        <div>
          <strong>Engine Oil</strong>
          <p style="font-size:12px;color:gray;">Change oil and check levels</p>
        </div>
        <button onclick="startARTutorial('engineOil')">Open</button>
      </div>

      <div class="task">
        <div>
          <strong>Tire Replacement</strong>
          <p style="font-size:12px;color:gray;">How to change a tire safely</p>
        </div>
        <button onclick="startARTutorial('tireReplacement')">Open</button>
      </div>

      <div class="task">
        <div>
          <strong>Battery Replacement</strong>
          <p style="font-size:12px;color:gray;">Replace the vehicle battery</p>
        </div>
        <button onclick="startARTutorial('batteryReplacement')">Open</button>
      </div>
    </div>

    <button id="continueBtn" onclick="goToExam()">Continue to Exam</button>
  </div>

  <footer>
    AutoScope AR &copy; 2025
  </footer>

  <script>
    let currentTask = "";

    // Launch AR experience using MyWebAR and show "Continue" button
    function startARTutorial(task) {
      currentTask = task;

      // Replace this URL with your MyWebAR project link
      window.open("https://mywebar.com/p/YOUR_AR_PROJECT_ID", "_blank");

      // Show the continue button so user can move to the exam manually
      document.getElementById('continueBtn').style.display = 'inline-block';
    }

    // Redirect user to the exam page with the selected task info
    function goToExam() {
      window.location.href = "exam.html?task=" + currentTask;
    }
  </script>
</body>
</html>
