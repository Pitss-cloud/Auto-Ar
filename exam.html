<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoScope AR - Exam</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #d32f2f;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .exam-container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #d32f2f;
    }

    .question {
      margin-bottom: 20px;
      font-size: 18px;
    }

    .options label {
      display: block;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .options input {
      margin-right: 10px;
    }

    .options label:hover {
      background: #fce4e4;
    }

    button {
      padding: 10px 20px;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }

    button:hover {
      background: #b71c1c;
    }

    .progress {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .result {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #d32f2f;
      margin-top: 20px;
    }

    .feedback {
      font-size: 16px;
      margin-top: 10px;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
    }

    .correct {
      background: #e0f7e9;
      color: #2e7d32;
      border: 1px solid #2e7d32;
    }

    .incorrect {
      background: #fce4e4;
      color: #c62828;
      border: 1px solid #c62828;
    }
  </style>
</head>
<body>
  <header>
    <h1>AutoScope AR Exam</h1>
  </header>

  <div class="exam-container">
    <h2 id="examTitle">Exam</h2>
    <div class="question" id="questionText"></div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback" style="display:none;"></div>

    <button onclick="submitAnswer()" id="submitBtn">Submit</button>
    <button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>

    <div class="progress" id="progress"></div>
    <div class="result" id="result"></div>

    <div style="text-align:center;margin-top:20px;">
      <button onclick="goBack()">Return to Dashboard</button>
    </div>
  </div>

  <script>
    // Sample questions
    const questions = [
      {
        question: "What is the first step in changing engine oil?",
        options: [
          "Remove the oil filter",
          "Drain the old oil",
          "Turn off the engine and let it cool",
          "Add new oil immediately"
        ],
        answer: 2 // Index of correct answer
      },
      {
        question: "Where is the battery typically located in most cars?",
        options: [
          "Under the driver's seat",
          "Inside the trunk",
          "Under the hood",
          "In the glove compartment"
        ],
        answer: 2
      },
      {
        question: "How often should tire pressure be checked?",
        options: [
          "Once a year",
          "Once a month",
          "Only before long trips",
          "Every 6 months"
        ],
        answer: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('questionText').textContent = q.question;

      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = "";
      q.options.forEach((option, index) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="radio" name="option" value="${index}"> ${option}`;
        optionsDiv.appendChild(label);
      });

      document.getElementById('feedback').style.display = "none";
      document.getElementById('submitBtn').style.display = "inline-block";
      document.getElementById('nextBtn').style.display = "none";

      document.getElementById('progress').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
    }

    function submitAnswer() {
      const selected = document.querySelector('input[name="option"]:checked');
      const feedbackDiv = document.getElementById('feedback');

      if (!selected) {
        alert("Please select an answer before submitting.");
        return;
      }

      selectedAnswer = parseInt(selected.value);
      const correctAnswer = questions[currentQuestion].answer;

      if (selectedAnswer === correctAnswer) {
        score++;
        feedbackDiv.textContent = "Correct! Well done.";
        feedbackDiv.className = "feedback correct";
      } else {
        feedbackDiv.textContent = `Incorrect. The correct answer is: ${questions[currentQuestion].options[correctAnswer]}`;
        feedbackDiv.className = "feedback incorrect";
      }

      feedbackDiv.style.display = "block";

      // Show next button, hide submit button
      document.getElementById('submitBtn').style.display = "none";
      document.getElementById('nextBtn').style.display = "inline-block";
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('examTitle').textContent = "Exam Completed";
      document.getElementById('questionText').style.display = "none";
      document.getElementById('options').style.display = "none";
      document.getElementById('submitBtn').style.display = "none";
      document.getElementById('nextBtn').style.display = "none";
      document.getElementById('feedback').style.display = "none";

      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById('result').textContent =
        `You scored ${score} out of ${questions.length} (${percentage}%)`;
    }

    function goBack() {
      window.location.href = "index.html";
    }

    // Load first question on page load
    window.onload = loadQuestion;
  </script>
</body>
</html>
